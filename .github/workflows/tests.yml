name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      # No necesita .env ni base de datos: los tests usan SQLite en memoria.
      - name: Correr tests con coverage
        run: |
          coverage run --source=app -m unittest discover -s tests -v
          coverage xml -o coverage.xml
          coverage report

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-backend
          path: backend/coverage.xml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Correr tests con coverage
        run: pnpm test:coverage

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-frontend
          path: frontend/coverage/lcov.info

  sonarqube:
    needs: [ backend, frontend ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - uses: actions/checkout@v4
        with:
          # Sonar necesita el historial completo para el blame y para detectar el código nuevo.
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: coverage-backend
          path: backend

      - uses: actions/download-artifact@v4
        with:
          name: coverage-frontend
          path: frontend/coverage

      # Vitest escribe las rutas relativas a frontend/ y Sonar las resuelve desde la raíz del repo.
      - name: Ajustar rutas del reporte del frontend
        run: sed -i 's|^SF:|SF:frontend/|' frontend/coverage/lcov.info

      - name: Analizar con SonarQube
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
